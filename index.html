<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #030712;
            --panel: #07111f;
            --panel2: #0a1728;
            --border: #16304d;
            --text: #f4f8ff;
            --muted: #7f96b2;
            --blue: #168cff;
            --blue2: #00b7ff;
            --input: #050d18;
        }

        body.light {
            --bg: #eef5fc;
            --panel: #ffffff;
            --panel2: #f4f8fd;
            --border: #cbd9e8;
            --text: #07111f;
            --muted: #60748b;
            --blue: #087cff;
            --blue2: #009de0;
            --input: #f8fbff;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% -10%, rgba(0, 140, 255, 0.16), transparent 35%),
                var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            transition: 0.25s;
        }

        .app {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            border-right: 1px solid var(--border);
            background: rgba(3, 10, 20, 0.85);
            padding: 18px;
            display: flex;
            flex-direction: column;
        }

        body.light .sidebar {
            background: rgba(255,255,255,0.9);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .logo span {
            color: var(--blue2);
        }

        button {
            border: 0;
            cursor: pointer;
            color: var(--text);
        }

        .new-chat {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue), var(--blue2));
            color: white;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .mode-title {
            color: var(--muted);
            font-size: 12px;
            margin: 10px 5px;
            text-transform: uppercase;
        }

        .mode {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            text-align: left;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
        }

        .mode.active,
        .mode:hover {
            background: var(--panel2);
            color: var(--text);
        }

        .theme {
            margin-top: auto;
            padding: 12px;
            border-radius: 10px;
            background: var(--panel2);
            color: var(--text);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 1px solid var(--border);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #19d477;
            box-shadow: 0 0 12px #19d477;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 35px 20px 160px;
        }

        .welcome {
            max-width: 800px;
            margin: 80px auto 0;
            text-align: center;
        }

        .welcome-logo {
            font-size: 55px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--text);
        }

        .welcome-logo span {
            color: var(--blue2);
        }

        .welcome p {
            color: var(--muted);
            font-size: 16px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 22px;
            padding: 17px 20px;
            border-radius: 16px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user {
            background: linear-gradient(135deg, #087cff, #00a8ed);
            color: white;
            margin-left: auto;
        }

        .assistant {
            background: var(--panel);
            border: 1px solid var(--border);
            margin-right: auto;
        }

        .composer {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            padding: 18px 20px 22px;
            background: linear-gradient(
                transparent,
                var(--bg) 25%
            );
        }

        .composer-inner {
            max-width: 850px;
            margin: auto;
            display: flex;
            gap: 10px;
            padding: 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 17px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }

        textarea {
            flex: 1;
            min-height: 48px;
            max-height: 180px;
            resize: none;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text);
            padding: 12px;
            font-family: inherit;
            font-size: 15px;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .send {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue), var(--blue2));
            color: white;
            font-size: 20px;
        }

        .send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .composer {
                left: 0;
            }

            .topbar {
                padding: 0 15px;
            }

            .chat {
                padding-left: 12
